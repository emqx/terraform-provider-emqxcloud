name: Security

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum
      - name: Scan dependencies for known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Scan Go source
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...
      - name: Scan repository content for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
